name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-build:
    name: Contracts, PostgreSQL persistence, lint, and build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://b2b_test:b2b_test_password@127.0.0.1:5432/b2b_site_studio_test
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: b2b_test
          POSTGRES_PASSWORD: b2b_test_password
          POSTGRES_DB: b2b_site_studio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U b2b_test -d b2b_site_studio_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full contract, persistence, lint, build, and HTTP gate
        run: npm run ci:full
