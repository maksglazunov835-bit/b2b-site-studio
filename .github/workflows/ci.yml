name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-build:
    name: Contracts, PostgreSQL persistence, lint, and build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://b2b_dev_fixture:b2b_dev_fixture_password@127.0.0.1:5433/b2b_site_studio_dev_fixture
      TEST_DATABASE_URL: postgresql://b2b_test:b2b_test_password@127.0.0.1:5432/b2b_site_studio_test
    services:
      postgres-dev:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: b2b_dev_fixture
          POSTGRES_PASSWORD: b2b_dev_fixture_password
          POSTGRES_DB: b2b_site_studio_dev_fixture
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U b2b_dev_fixture -d b2b_site_studio_dev_fixture"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: b2b_test
          POSTGRES_PASSWORD: b2b_test_password
          POSTGRES_DB: b2b_site_studio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U b2b_test -d b2b_site_studio_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for UI regression tests
        run: |
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo env APT_CONFIG="$GITHUB_WORKSPACE/.github/ci/playwright-apt.conf" "$(command -v node)" node_modules/playwright/cli.js install-deps chromium
          npx --no-install playwright install chromium

      - name: Seed separate disposable dev project before the test suite
        run: node tests/persistence/seed-dev-sentinel.mjs

      - name: Run full contracts, persistence, UI, lifecycle, security, lint and build gate
        run: npm run ci:full

      - name: Upload bounded test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-validation-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .test-results/ci-summary.json
            .test-results/jobs-desktop.png
            .test-results/jobs-mobile.png
            .test-results/persistence-desktop.png
            .test-results/persistence-mobile.png
            .test-results/runner-desktop.png
            .test-results/runner-mobile.png
            .test-results/execution-desktop.png
            .test-results/execution-mobile.png
            .test-results/design-1-desktop.png
            .test-results/design-2-desktop.png
            .test-results/design-3-desktop.png
            .test-results/design-1-mobile.png
            .test-results/design-2-mobile.png
            .test-results/design-3-mobile.png
            .test-results/process-tree-linux.json
            .test-results/wsl-protocol-linux.json

  windows-process-tree:
    name: Windows native process-tree and streaming regressions
    runs-on: windows-latest
    env:
      TEST_DATABASE_URL: postgresql://b2b_test:disposable@127.0.0.1:5432/b2b_site_studio_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # This mode validates the separate TEST target but performs no SQL.
      - name: Run native regressions in an explicit test-only environment
        shell: pwsh
        run: |
          # Hosted Windows images include PostgreSQL tooling environment defaults.
          # Clear only this step's PG* variables, never relax safe-runner rejection.
          Get-ChildItem Env: | Where-Object Name -Match '^PG' | ForEach-Object {
            Write-Output ("Removing hosted environment name: " + $_.Name)
            Remove-Item -LiteralPath ('Env:' + $_.Name)
          }
          node scripts/persistence/run-tests.mjs design-regressions
      - uses: actions/upload-artifact@v4
        with:
          name: windows-process-tree-${{ github.event.pull_request.head.sha || github.sha }}
          path: .test-results/process-tree-win32.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
